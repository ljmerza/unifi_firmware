[project]
name = "unifi-firmware-tracker"
version = "1.0.0"
description = "Weekly scraper + web UI for UniFi firmware releases"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "requests>=2.32",
    "apscheduler>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.coverage.run]
omit = ["tests/*"]
